name: Development checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0; reads rust-toolchain.toml
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff  # v2.87.8
        with:
          tool: cargo-deny@0.20.2
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check repository policy
        run: cargo run --locked --example check-policy
      - name: Check dependency policy
        run: cargo deny --locked --all-features check
      - name: Check installer failure and recovery fixtures
        run: python3 tests/installer.py --suite fixtures
      - name: Check native candidate preparation fixtures
        run: python3 tests/prepare_installer.py
      - name: Check offline Codex acceptance fixtures
        run: python3 scripts/acceptance/test_codex_mcp.py
      - name: Check offline release preparation and publication fixtures
        run: python3 tests/release.py

  components:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features: [cli, mcp, 'cli,mcp']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
      - name: Build selected components
        run: cargo build --locked --workspace --all-targets --no-default-features --features "$MAILCTL_FEATURES"
        shell: bash
        env:
          MAILCTL_FEATURES: ${{ matrix.features }}
      - name: Lint selected components
        run: cargo clippy --locked --workspace --all-targets --no-default-features --features "$MAILCTL_FEATURES" -- -D warnings
        shell: bash
        env:
          MAILCTL_FEATURES: ${{ matrix.features }}
      - name: Test selected components
        run: cargo test --locked --workspace --no-default-features --features "$MAILCTL_FEATURES"
        shell: bash
        env:
          MAILCTL_FEATURES: ${{ matrix.features }}
      - name: Qualify optimized decoding and executable stacks on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          MAILCTL_FEATURES: ${{ matrix.features }}
        run: ./scripts/ci/windows-acceptance.ps1 mime-depth
      - name: Repeat concurrent Windows draft acceptance
        if: matrix.os == 'windows-latest' && matrix.features == 'cli,mcp'
        shell: pwsh
        run: ./scripts/ci/windows-acceptance.ps1 repeat-drafts

  greenmail:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
      # Testcontainers starts GreenMail but needs a running Docker Engine.
      # Its pinned Rust client requires a newer API than the runner provides.
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70  # v5.5.0
        with:
          version: v29.9.0
          set-host: true
      - name: Record OpenSSL version
        run: openssl version
      - name: Lint GreenMail integration
        run: cargo clippy --locked --workspace --all-targets --features docker-tests -- -D warnings
      - name: Test GreenMail integration
        run: cargo test --locked --test greenmail --features docker-tests -- --nocapture

  systemd-credentials:
    strategy:
      fail-fast: false
      matrix:
        features: [cli, mcp, 'cli,mcp']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
      - name: Qualify systemd credentials under a disposable service identity
        shell: bash
        env:
          MAILCTL_FEATURES: ${{ matrix.features }}
        run: bash scripts/ci/native-acceptance.sh systemd

  windows-native-credentials:
    strategy:
      fail-fast: false
      matrix:
        features: [cli, mcp, 'cli,mcp']
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
      - name: Qualify Credential Manager on the disposable hosted Windows identity
        shell: pwsh
        env:
          MAILCTL_FEATURES: ${{ matrix.features }}
          MAILCTL_DISPOSABLE_WINDOWS: '1'
        run: ./scripts/ci/windows-acceptance.ps1 credentials

  native-credentials:
    # Qualify native credentials using the installed candidate bytes. Reuse this
    # job rather than compiling a second macOS acceptance harness in another VM.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
      - name: Install dist 0.33.0 from its official release
        shell: bash
        env:
          DIST_BIN_DIR: ${{ runner.temp }}/dist-bin
        run: bash scripts/ci/install-dist.sh
      - name: Build macOS Apple Silicon archives with dist
        run: bash scripts/ci/candidate.sh build
      - name: Prepare component manifest and signing evidence from the dist archive
        env:
          # Candidate evidence must not be restored with the Rust target cache.
          MAILCTL_CANDIDATE_DIR: ${{ runner.temp }}/mailctl-release-candidate
          MAILCTL_PACKAGED_BIN_DIR: ${{ runner.temp }}/mailctl-installed
        run: bash scripts/ci/candidate.sh prepare
      - name: Qualify selected components through the standalone installer
        run: bash scripts/ci/candidate.sh installer
      - name: Qualify packaged setup, history, backup, and restore
        run: bash scripts/ci/candidate.sh state
      - name: Qualify packaged interfaces and process lifecycle
        run: bash scripts/ci/candidate.sh process
      - name: Qualify packaged native credentials on the disposable hosted identity
        run: bash scripts/ci/candidate.sh native
      - name: Qualify packaged reading for each standalone component selection
        run: bash scripts/ci/candidate.sh reading
      - name: Qualify packaged draft faults and history per component
        run: bash scripts/ci/candidate.sh drafts
      - name: Record passing candidate acceptance
        run: bash scripts/ci/candidate.sh record
      - name: Keep candidate downloads and acceptance evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mailctl-candidate-aarch64-apple-darwin
          path: ${{ env.MAILCTL_CANDIDATE_DIR }}/
          if-no-files-found: error
          retention-days: 14

  linux-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MAILCTL_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
      - name: Install dist 0.33.0 from its official release
        shell: bash
        env:
          DIST_BIN_DIR: ${{ runner.temp }}/dist-bin
        run: bash scripts/ci/install-dist.sh
      - name: Build native Ubuntu x86_64 archives with dist
        run: bash scripts/ci/candidate.sh build
      - name: Prepare Linux components and build evidence
        env:
          MAILCTL_CANDIDATE_DIR: ${{ runner.temp }}/mailctl-linux-candidate
          MAILCTL_PACKAGED_BIN_DIR: ${{ runner.temp }}/mailctl-linux-installed
        run: bash scripts/ci/candidate.sh prepare
      - name: Qualify Linux installation, upgrades and removal
        run: bash scripts/ci/candidate.sh installer
      - name: Qualify packaged Linux setup, history, backup and restore
        run: bash scripts/ci/candidate.sh state
      - name: Qualify independent packaged Linux processes
        run: bash scripts/ci/candidate.sh process
      - name: Qualify headless credential sources and permissions
        run: bash scripts/ci/candidate.sh native
      - name: Qualify packaged Linux reading under command and systemd sources
        run: bash scripts/ci/candidate.sh reading
      - name: Qualify packaged Linux draft faults under command and systemd sources
        run: bash scripts/ci/candidate.sh drafts
      - name: Install native Secret Service test prerequisites
        run: bash scripts/ci/desktop-acceptance.sh prerequisites
      - name: Qualify native Secret Service lifecycle and locked-store behavior
        run: bash scripts/ci/desktop-acceptance.sh credentials
      - name: Qualify packaged reading with native Secret Service credentials
        run: bash scripts/ci/desktop-acceptance.sh reading
      - name: Qualify packaged draft recovery with native Secret Service credentials
        run: bash scripts/ci/desktop-acceptance.sh drafts
      - name: Record passing Linux candidate acceptance
        run: bash scripts/ci/candidate.sh record
      - name: Keep Linux candidate and acceptance evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mailctl-candidate-x86_64-unknown-linux-gnu
          path: ${{ env.MAILCTL_CANDIDATE_DIR }}/
          if-no-files-found: error
          retention-days: 14

  windows-candidate:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      MAILCTL_TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
      - name: Install dist 0.33.0 from its official release
        shell: pwsh
        env:
          DIST_BIN_DIR: ${{ runner.temp }}/dist-bin
        run: ./scripts/ci/install-dist.ps1
      - name: Build native Windows x86_64 archives with dist
        shell: pwsh
        run: ./scripts/ci/windows-candidate.ps1 build
      - name: Prepare Windows components and build evidence
        shell: pwsh
        env:
          MAILCTL_CANDIDATE_DIR: ${{ runner.temp }}/mailctl-windows-candidate
          MAILCTL_PACKAGED_BIN_DIR: ${{ runner.temp }}/mailctl-windows-installed
        run: ./scripts/ci/windows-candidate.ps1 prepare
      - name: Qualify installation, upgrades and removal with PowerShell 5.1 and 7
        shell: pwsh
        run: ./scripts/ci/windows-candidate.ps1 installer
      - name: Build reusable Windows acceptance harnesses
        shell: pwsh
        run: ./scripts/ci/windows-packaged-acceptance.ps1 prepare
      - name: Qualify installed setup, shared account state, backup and restore
        shell: pwsh
        run: ./scripts/ci/windows-packaged-acceptance.ps1 state
      - name: Qualify installed interfaces, export and process recovery
        shell: pwsh
        run: ./scripts/ci/windows-packaged-acceptance.ps1 process
      - name: Qualify installed Credential Manager lifecycle under a disposable identity
        shell: pwsh
        run: ./scripts/ci/windows-packaged-acceptance.ps1 native
      - name: Qualify installed reading through native Windows credentials
        shell: pwsh
        run: ./scripts/ci/windows-packaged-acceptance.ps1 reading
      - name: Qualify installed draft faults and recovery
        shell: pwsh
        run: ./scripts/ci/windows-packaged-acceptance.ps1 drafts
      - name: Record passing Windows candidate acceptance
        shell: pwsh
        run: ./scripts/ci/windows-candidate.ps1 record
      - name: Keep Windows candidate and acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mailctl-candidate-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/mailctl-windows-candidate/
          if-no-files-found: error
          retention-days: 14

  native-isolation:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
      - name: Lint isolated access
        run: cargo clippy --locked --workspace --all-targets --features isolated -- -D warnings
      - name: Test isolated process access
        run: cargo test --locked --features isolated --test isolation_process
      - name: Qualify isolated access with disposable macOS identities
        timeout-minutes: 5
        shell: bash
        run: bash scripts/ci/native-acceptance.sh isolation
