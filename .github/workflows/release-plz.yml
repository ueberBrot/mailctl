name: Release preparation
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-preparation
  cancel-in-progress: false

jobs:
  release-pr:
    if: github.repository == 'ueberBrot/mailctl' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30  # v2.0.1; reads rust-toolchain.toml
        with:
          cache: false
      - name: Check original release history
        id: preparation
        env:
          MAILCTL_RELEASE_POLICY_DIR: ${{ runner.temp }}/mailctl-release-policy
        run: python3 scripts/prepare-release.py plan --output "$MAILCTL_RELEASE_POLICY_DIR"
      - name: Prepare the release PR
        if: steps.preparation.outputs.release == 'true'
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b  # v0.5.148
        with:
          command: release-pr
          version: 0.4.3
          config: ${{ steps.preparation.outputs.config }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
