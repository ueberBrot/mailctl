[workspace]
members = [".", "tests/greenmail-support"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false

[package]
name = "mailctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.6.6", default-features = false, features = ["std", "help", "usage", "error-context"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
schemars = { version = "1.2.2", features = ["uuid1"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal"] }
rmcp = { version = "=3.2.0", default-features = false, features = ["server", "transport-io"] }
tokio-util = { version = "0.7.19", features = ["codec", "rt"] }
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process", "net"] }

[dev-dependencies]
rmcp = { version = "=3.2.0", default-features = false, features = ["client", "transport-child-process"] }
cargo_metadata = "0.23.1"
greenmail-support = { version = "0.1.0", path = "tests/greenmail-support" }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.5"

[features]
default = []
docker-tests = ["greenmail-support/docker"]

[[test]]
name = "greenmail"
required-features = ["docker-tests"]

[workspace.lints.rust]
unsafe_code = "forbid"

[lints]
workspace = true
