[workspace]
members = [".", "tests/greenmail-support"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false

[package]
name = "mailctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.6.6", default-features = false, features = ["std", "help", "usage", "error-context"] }

[dev-dependencies]
cargo_metadata = "0.23.1"
greenmail-support = { version = "0.1.0", path = "tests/greenmail-support" }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.5"

[features]
default = []
docker-tests = ["greenmail-support/docker"]

[[test]]
name = "greenmail"
required-features = ["docker-tests"]

[workspace.lints.rust]
unsafe_code = "forbid"

[lints]
workspace = true
