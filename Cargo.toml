[workspace]
members = [".", "tests/greenmail-support"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "ISC"
publish = false

[package]
name = "mailctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.6.6", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
schemars = { version = "1.2.2", features = ["uuid1"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal"] }
io-imap = { version = "=0.6.0", default-features = false }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
zeroize = "=1.9.0"
rmcp = { version = "=3.2.0", optional = true, default-features = false, features = ["server", "transport-io"] }
tokio-util = { version = "0.7.19", optional = true, features = ["codec", "rt"] }
futures-util = { version = "0.3.32", optional = true, default-features = false, features = ["std"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry", "fmt", "json", "ansi"] }
anstream = "1.0.0"
sha2 = "0.11.0"
getrandom = "0.4.3"
etcetera = "0.11.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[dev-dependencies]
allocation-counter = "=0.8.1"
rcgen = { version = "=0.14.7", default-features = false, features = ["ring"] }
rmcp = { version = "=3.2.0", default-features = false, features = ["client", "transport-child-process"] }
cargo_metadata = "0.23.1"
greenmail-support = { version = "0.1.0", path = "tests/greenmail-support" }
serde_json = "1.0.151"
toml = "1.1.5"

[features]
default = ["cli", "mcp"]
cli = []
mcp = ["dep:rmcp", "dep:tokio-util", "dep:futures-util"]
docker-tests = ["greenmail-support/docker"]

[[bin]]
name = "mailctl"
path = "src/bin/mailctl.rs"
required-features = ["cli"]

[[bin]]
name = "mailctl-mcp"
path = "src/bin/mailctl-mcp.rs"
required-features = ["mcp"]

[[test]]
name = "greenmail"
required-features = ["docker-tests"]

[workspace.lints.rust]
unsafe_code = "forbid"

[lints]
workspace = true
