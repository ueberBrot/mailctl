# Applies to production and development dependencies on every target.
[advisories]
unmaintained = "all"
yanked = "deny"
unused-ignored-advisory = "deny"
ignore = [
  { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; required by oo7's published zbus 5 backend. Review by 2026-11-18 in #93; remove after the backend migration." },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; required by oo7's published zbus 5 backend. Review by 2026-11-18 in #93; remove after the backend migration." },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; required by oo7's published zbus 5 backend. Review by 2026-11-18 in #93; remove after the backend migration." },
]

[licenses]
confidence-threshold = 0.93
allow = [
  "MIT", "MIT-0", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0",
  "Zlib", # foldhash, through jsonschema's hashbrown dependency
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
