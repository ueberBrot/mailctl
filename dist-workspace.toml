[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
# Development checks build candidates; release.yml attaches their verified
# artifacts to the release-plz release. Do not generate a second publisher.
ci = []
installers = []
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
unix-archive = ".tar.gz"
windows-archive = ".zip"
checksum = "sha256"
precise-builds = true
default-features = false
features = ["cli", "mcp"]
# Only the product package opts in; test launchers must never be distributed.
dist = false

[dist.binaries]
aarch64-apple-darwin = ["mailctl", "mailctl-mcp"]
x86_64-unknown-linux-gnu = ["mailctl", "mailctl-mcp"]
x86_64-pc-windows-msvc = ["mailctl", "mailctl-mcp"]
