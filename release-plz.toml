[workspace]
# release.yml runs release-plz after the merged release PR passes CI.
git_only = true
publish = false
git_tag_enable = false
git_release_enable = false
release_always = false
dependencies_update = false
semver_check = false
release = false
pr_name = "chore: prepare mailctl v{{ version }}"

[[package]]
name = "mailctl"
release = true
changelog_path = "CHANGELOG.md"
git_tag_name = "v{{ version }}"
git_tag_enable = true
git_release_enable = true
git_release_draft = true
git_release_latest = false
git_release_body = "{{ changelog | trim }}"

[changelog]
body = """
## [{{ version }}]{%- if release_link -%}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}
{%- if commit.scope -%}
- *({{commit.scope}})* {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}{%- if commit.links %} ({% for link in commit.links %}[{{link.text}}]({{link.href}}) {% endfor -%}){% endif %}
{% else -%}
- {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}
{% endif -%}
{% endfor -%}
{% endfor %}
"""
protect_breaking_commits = true
commit_parsers = [
    { message = "^feat", group = "added" },
    { message = "^fix", group = "fixed" },
    { message = "^perf", group = "performance" },
    { message = "^security", group = "security" },
    { message = "^docs", group = "documentation" },
    { message = ".*", group = "other" },
]
