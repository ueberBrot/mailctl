[package]
name = "mailctl-process-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[lib]
path = "process-driver/src/lib.rs"

[features]
default = ["cli", "mcp"]
cli = ["mailctl/cli"]
mcp = ["mailctl/mcp"]

[dependencies]
mailctl = { path = "..", default-features = false }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
uuid = "1.27.0"

[dev-dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
toml = "1.1.8"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-child-process"] }
serde_json = "1.0.151"
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem"] }
io-imap = { version = "=0.7.1", default-features = false }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_Console"] }

[[bin]]
name = "mailctl-test-cli"
path = "process-driver/src/bin/cli.rs"
required-features = ["cli"]

[[bin]]
name = "mailctl-test-mcp"
path = "process-driver/src/bin/mcp.rs"
required-features = ["mcp"]

[[bin]]
name = "credential-helper"
path = "process-driver/src/bin/credential-helper.rs"

[[test]]
name = "credential_command"
path = "process-driver/tests/credential_command.rs"

[[test]]
name = "drafts"
path = "process-driver/tests/drafts.rs"

[[test]]
name = "export"
path = "process-driver/tests/export.rs"

[[test]]
name = "host"
path = "process-driver/tests/host.rs"

[[test]]
name = "message_handoff"
path = "process-driver/tests/message_handoff.rs"

[[test]]
name = "mailbox_scope"
path = "process-driver/tests/mailbox_scope.rs"

[[test]]
name = "session_credentials"
path = "process-driver/tests/session_credentials.rs"

[lints]
workspace = true
