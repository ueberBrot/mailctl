[package]
name = "greenmail-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
docker = ["dep:testcontainers", "dep:reqwest", "dep:serde", "dep:serde_json", "dep:tokio", "dep:tokio-rustls", "dep:tempfile", "dep:serde-saphyr", "dep:jsonschema", "dep:io-imap", "dep:nom"]

[dependencies]
testcontainers = { version = "=0.28.0", default-features = false, optional = true }
reqwest = { version = "=0.13.5", default-features = false, features = ["json"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "process"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
tempfile = { version = "3.27.0", optional = true }
serde-saphyr = { version = "=1.3.0", optional = true }
jsonschema = { version = "0.58.6", default-features = false, optional = true }
io-imap = { version = "=0.7.1", default-features = false, optional = true }
# Keep the standalone fixture's featureless IMAP codec independent of transitive nom features.
nom = { version = "7.1.3", default-features = false, features = ["alloc"], optional = true }

[lints]
workspace = true
